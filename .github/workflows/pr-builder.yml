# This workflow will build the project on pull requests with tests
# Uses:
#   OS: ubuntu-latest
#   JDK: Adopt JDK 21
#
# Build strategy:
#   Pass 1 - compile and install every module WITHOUT tests.
#   Pass 2 - run tests only for the modules touched by the PR and their dependents.
#   A change to the root pom.xml, this workflow, or the module detection script
#   falls back to testing everything.

name: PR Builder

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx4g -Xms1g
  # Pass 1 must stay serial: carbon-p2-plugin takes its bundle list from plugin
  # configuration rather than <dependencies>, so a feature module has no reactor
  # edge to the components it packages. Serial builds happen to work because the
  # root pom lists every component before every feature; under -T that ordering
  # is not guaranteed and p2-feature-gen fails on target/classes.
  MVN_BUILD_THREADS: 1
  # Pass 2 is safe to parallelise: `mvn test` stops before the package phase, so
  # p2-feature-gen never runs.
  MVN_TEST_THREADS: 1C

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can diff against the base branch.
          fetch-depth: 0
      - name: Set up Adopt JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: "21"
          distribution: "adopt"
      - name: Cache local Maven repository
        id: cache-maven-m2
        uses: actions/cache@v3
        env:
          cache-name: cache-m2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ env.cache-name }}-
            ${{ runner.os }}-maven-
            ${{ runner.os }}-

      - name: Determine modules changed by this PR
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request - testing everything."
            echo "modules=FULL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          BASE_SHA=$(git merge-base HEAD "origin/$BASE_REF")
          echo "Diffing against $BASE_REF ($BASE_SHA)"

          # Anything that can change the build as a whole, or the selection
          # logic itself, invalidates the selective build.
          if git diff --name-only -z "$BASE_SHA" HEAD \
            | tr '\0' '\n' \
            | grep -qE '^(pom\.xml|\.github/workflows/pr-builder\.yml|\.github/scripts/changed-modules\.py)$'; then
            echo "Root pom.xml, this workflow or the detection script changed - testing everything."
            echo "modules=FULL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PL=$(.github/scripts/changed-modules.py "$BASE_SHA")
          echo "Modules to test: ${PL:-<none>}"
          echo "modules=$PL" >> "$GITHUB_OUTPUT"

      - name: Build all modules (no tests)
        run: |
          mvn clean install -U -B -T "$MVN_BUILD_THREADS" \
            -Dmaven.test.skip=true \
            -Dmaven.javadoc.skip=true

      - name: Run tests for changed modules
        if: steps.changed.outputs.modules != '' && steps.changed.outputs.modules != 'FULL'
        run: |
          mvn test -B -T "$MVN_TEST_THREADS" \
            -pl '${{ steps.changed.outputs.modules }}' -amd

      - name: Run all tests
        if: steps.changed.outputs.modules == 'FULL'
        run: mvn test -B -T "$MVN_TEST_THREADS"

      - name: Generate coverage report
        run: mvn jacoco:report
      - name: Delete SNAPSHOT artifacts
        run: find ~/.m2/repository/ -name "*-SNAPSHOT" -type d -print -prune -exec rm -r {} +
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          flags: unit

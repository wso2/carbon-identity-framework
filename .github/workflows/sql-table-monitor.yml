# This workflow monitors SQL file changes and detects new table creations
# It will comment on PRs when new tables are added, reminding to update cleanup scripts

name: SQL Table Monitor

on:
  pull_request_target:
    branches: [master, resource-cleanup-check]
    paths:
      - 'features/identity-core/org.wso2.carbon.identity.core.server.feature/resources/dbscripts/*.sql'

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-new-tables:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze SQL changes and comment on new tables
        id: analyze-tables
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const sqlPathPattern =
              /^features\/identity-core\/org\.wso2\.carbon\.identity\.core\.server\.feature\/resources\/dbscripts\/[^/]+\.sql$/;
            const createTablePattern =
              /CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?([A-Za-z_][A-Za-z0-9_]*)/i;

            const { data: pullRequestDetails } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number
            });

            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                per_page: 100
              }
            );

            if (changedFiles.length < pullRequestDetails.changed_files) {
              core.setFailed(
                `GitHub returned ${changedFiles.length} of ` +
                `${pullRequestDetails.changed_files} changed files; SQL analysis would be incomplete.`
              );
              return;
            }

            const sqlFiles = changedFiles.filter(file =>
              sqlPathPattern.test(file.filename)
            );

            core.setOutput('has_sql_changes', String(sqlFiles.length > 0));
            core.setOutput('new_tables_found', 'false');

            if (sqlFiles.length === 0) {
              core.info('No SQL files changed');
              return;
            }

            const newTables = [];
            const seenTables = new Set();

            for (const file of sqlFiles) {
              core.info(`Analyzing file: ${file.filename}`);

              if (file.additions === 0) {
                core.info(`Skipping ${file.filename}; it has no added lines`);
                continue;
              }

              if (typeof file.patch !== 'string') {
                core.setFailed(
                  `The patch for ${file.filename} is unavailable; ` +
                  'SQL analysis would be incomplete.'
                );
                return;
              }

              for (const line of file.patch.split('\n')) {
                if (!line.startsWith('+') || line.startsWith('+++')) {
                  continue;
                }

                const match = line.slice(1).match(createTablePattern);
                if (!match) {
                  continue;
                }

                const tableName = match[1];
                const key = `${file.filename}\0${tableName.toLowerCase()}`;
                if (!seenTables.has(key)) {
                  seenTables.add(key);
                  newTables.push({ name: tableName, file: file.filename });
                }
              }
            }

            if (newTables.length === 0) {
              core.info('SQL files were modified but no new tables were detected');
              return;
            }

            core.setOutput('new_tables_found', 'true');

            const newTablesList = newTables
              .map(({ name, file }) => {
                const safeFileName = file.replace(/[\r\n`]/g, '_');
                return `- **${name}** (in \`${safeFileName}\`)`;
              })
              .join('\n');
            
            const comment = `## 🚨 New Database Tables Detected
            
            This PR introduces new database table(s). Please ensure that the corresponding **resource cleanup scripts** are updated accordingly.
            
            ### New Tables:
            ${newTablesList}
            
            ### Required Actions:
            
            1. **Update Resource Cleanup Scripts**: Please update the cleanup scripts in the **identity-organization-resource-cleanup** repository:
               - Repository: https://github.com/wso2-extensions/identity-organization-resource-cleanup
               - Add cleanup logic for the new table(s) to handle data removal during organization deletion
               - Ensure cleanup scripts support all database types (MySQL, PostgreSQL, Oracle, MS SQL Server, DB2, H2)
            
            2. **Test Cleanup Functionality**: 
               - Verify that the new table data is properly cleaned up during organization resource cleanup operations
               - Test across all supported database platforms
               - Ensure no orphaned data remains after cleanup
            
            3. **Update Documentation**: If applicable, update any related documentation regarding the cleanup process for the new tables
            
            ### Database Support Checklist:
            Please verify your new table(s) are compatible with all supported databases:
            - [ ] MySQL
            - [ ] PostgreSQL  
            - [ ] Oracle
            - [ ] MS SQL Server
            - [ ] DB2
            - [ ] H2
            
            ---
            
            *This is an automated message. If this is a false positive or if you have questions, please reach out to the maintainers.*`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.analyze-tables.outcome }}" = "failure" ]; then
            echo "❌ SQL change analysis failed"
          elif [ "${{ steps.analyze-tables.outputs.has_sql_changes }}" = "false" ]; then
            echo "✅ No SQL files were modified in this PR"
          elif [ "${{ steps.analyze-tables.outputs.new_tables_found }}" = "false" ]; then
            echo "✅ SQL files were modified but no new tables were detected"
          else
            echo "🚨 New database tables detected - PR comment posted"
          fi
